<title>皓樣 ISO 查驗證</title>

<style>
/* ===============================
   全域骨架（footer 穩定）
================================ */
html, body {
    height: 100%;
    margin: 0;
}
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #333;

    background-image: url('https://github.com/Sethjesus/Photo/blob/main/sky4.jpg?raw=true');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* 主內容撐滿高度 */
main {
    flex: 1;
}

/* ===============================
   左上角 Logo（保留動畫）
================================ */
.logo {
    position: fixed;
    top: 15px;
    left: 15px;
    width: 60px;
    z-index: 9999;
    animation: floatLogo 3s ease-in-out infinite;
}
@keyframes floatLogo {
    0% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.1) translateY(-5px); }
    100% { transform: scale(1) translateY(0); }
}

/* ===============================
   內容容器
================================ */
.container {
    width: 90%;
    max-width: 1200px;
    margin: 40px auto;
    padding: 20px;
    background-color: rgba(255,255,255,0.4);
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,.2);
}

/* ===============================
   標題
================================ */
h1 {
    text-align: center;
    margin-top: 20px;
    color: #007bff;
    font-size: 48px;
}

/* ===============================
   表格
================================ */
.content-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}
.content-table td {
    padding: 20px;
    border: 1px solid #dddddd;
    vertical-align: middle;
}
.first-row td {
    background-color: #007bff;
    color: #ffffff;
    text-align: left;
    font-size: 22px;
    font-weight: bold;
}
.content-left {
    text-align: left;
}

/* ISO 標題 */
.highlight {
    font-size: 24px;
    font-weight: bold;
    color: #071a2e;
}

/* ===============================
   圖片格線
================================ */
.image-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 10px;
}
.image-grid a {
    display: block;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,.2);
    transition: transform .3s ease, box-shadow .3s ease;
}
.image-grid img {
    width: 100%;
    border-radius: 8px;
    transition: transform .3s ease;
}
.image-grid a:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 16px rgba(0,0,0,.3);
}

/* ===============================
   統一浮動回首頁（全站唯一）
================================ */
.float-home-btn{
    position: fixed;
    right: 22px;
    bottom: 22px;

    width: 64px;
    height: 72px;
    border-radius: 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    background: linear-gradient(135deg,#0b6bff,#00c6ff);
    color: #fff;
    text-decoration: none;
    font-weight: 700;

    box-shadow: 0 14px 30px rgba(0,0,0,.35);
    z-index: 9999;

    transition: transform .2s ease, box-shadow .2s ease;
}
.float-home-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 18px 38px rgba(0,0,0,.45);
}
.float-home-btn .icon { font-size: 24px; }
.float-home-btn .label { font-size: 12px; }

@media (max-width: 768px){
    .float-home-btn{
        width: 56px;
        height: 64px;
        right: 16px;
        bottom: 16px;
    }
}

/* ===============================
   Footer（不 fixed）
================================ */
footer {
    text-align: center;
    padding: 18px;
    background-color: rgba(44,62,80,.9);
    color: #ffffff;
}
</style>
</head>

<!-- Logo -->
<img src="https://pub-531c96b02ed745e0bbfd0e96bfde8518.r2.dev/UDM%20New%20Logo.jpg"

                        </a>

                        </a>
                        <a href="https://international.afnor.com/zh-tw/">
                            <img src="https://pub-531c96b02ed745e0bbfd0e96bfde8518.r2.dev/afnor.jpg">
                        </a>
                        <a href="https://www.bsigroup.com/zh-TW/">
                            <img src="https://pub-531c96b02ed745e0bbfd0e96bfde8518.r2.dev/bsi.jpg">
                        </a>
                        <a href="https://www.ares-registration.com/">
                            <img src="https://pub-531c96b02ed745e0bbfd0e96bfde8518.r2.dev/Ares.jpg">
                        </a>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</main>

<footer>
